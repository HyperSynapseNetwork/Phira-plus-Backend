# Phira+ 反向代理模板（Nginx）。
#
# 域名固定（contract §11）：
#   api-phira.htadiy.com  → PPB（API，TLS 终止在 Nginx）
#   phira.htadiy.com      → PPF（静态站点）
#   panel-phira.htadiy.com→ Panel（SPA）
#
# 生产请替换证书路径（Let's Encrypt/certbot 或内部 CA）。
# WebSocket（/ws/v1/...）必须配置 Upgrade 头。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ppb_backend {
    server 127.0.0.1:8080;   # PPB
    keepalive 16;
}

# ── PPB API ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api-phira.htadiy.com;

    ssl_certificate     /etc/nginx/tls/api-phira.htadiy.com.pem;
    ssl_certificate_key /etc/nginx/tls/api-phira.htadiy.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location /ws/ {
        proxy_pass http://ppb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://ppb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── PPF 静态站点 ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name phira.htadiy.com;

    ssl_certificate     /etc/nginx/tls/phira.htadiy.com.pem;
    ssl_certificate_key /etc/nginx/tls/phira.htadiy.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/ppf/dist;   # PPF SSG 输出
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Panel SPA ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name panel-phira.htadiy.com;

    ssl_certificate     /etc/nginx/tls/panel-phira.htadiy.com.pem;
    ssl_certificate_key /etc/nginx/tls/panel-phira.htadiy.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/panel/dist;   # Panel SPA 输出
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── HTTP → HTTPS ───────────────────────────────────────────────
server {
    listen 80;
    server_name api-phira.htadiy.com phira.htadiy.com panel-phira.htadiy.com;
    return 301 https://$host$request_uri;
}
