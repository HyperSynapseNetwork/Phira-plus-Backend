# Phira+ V3 Golden Deployment — clean-source build of the three public services.
# Run from the bundle root with:
#   docker compose --env-file repos/ppb/Phira-plus-Backend-main/deploy/.env \
#     -f repos/ppb/Phira-plus-Backend-main/deploy/docker-compose.yml build --no-cache

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PPB_DB_USER:-ppb}
      POSTGRES_PASSWORD: ${PPB_DB_PASSWORD:?set PPB_DB_PASSWORD}
      POSTGRES_DB: ${PPB_DB_NAME:-ppb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ppb:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PPB_DATABASE_URL: postgres://${PPB_DB_USER:-ppb}:${PPB_DB_PASSWORD}@postgres:5432/${PPB_DB_NAME:-ppb}
      PPB_JWT_SECRET: ${PPB_JWT_SECRET:?set PPB_JWT_SECRET}
      PPB_PHIRA_CREDENTIAL_KEY: ${PPB_PHIRA_CREDENTIAL_KEY:?set PPB_PHIRA_CREDENTIAL_KEY}
      PPB_PMP_OPENUDS_TOKEN: ${PPB_PMP_OPENUDS_TOKEN:-}
      PPB_RUNTIME_CONFIG: /etc/ppb/ppb.toml
      PPB_GITHUB_CLIENT_ID: ${PPB_GITHUB_CLIENT_ID:-}
      PPB_GITHUB_CLIENT_SECRET: ${PPB_GITHUB_CLIENT_SECRET:-}
      PPB_VAPID_PRIVATE_KEY_PEM: ${PPB_VAPID_PRIVATE_KEY_PEM:-}
      PPB_VAPID_SUBJECT: ${PPB_VAPID_SUBJECT:-}
      # Optional controlled deployment adapters. Values are fixed JSON argv,
      # never shell snippets. Keep unset to hide the corresponding capability.
      PPB_PMP_SUPERVISOR_START_JSON: ${PPB_PMP_SUPERVISOR_START_JSON:-}
      PPB_PMP_SUPERVISOR_STOP_JSON: ${PPB_PMP_SUPERVISOR_STOP_JSON:-}
      PPB_PMP_SUPERVISOR_ARG_SCHEMA_JSON: ${PPB_PMP_SUPERVISOR_ARG_SCHEMA_JSON:-}
      PPB_PMP_SUPERVISOR_WORKDIR: ${PPB_PMP_SUPERVISOR_WORKDIR:-}
      PPB_PPF_BUILD_COMMAND_JSON: ${PPB_PPF_BUILD_COMMAND_JSON:-}
      PPB_PPF_BUILD_WORKDIR: ${PPB_PPF_BUILD_WORKDIR:-}
      PPB_BACKUP_COMMAND_JSON: ${PPB_BACKUP_COMMAND_JSON:-}
      PPB_BACKUP_WORKDIR: ${PPB_BACKUP_WORKDIR:-}
      PPB_DEPLOYMENT_COMMAND_TIMEOUT_SECS: ${PPB_DEPLOYMENT_COMMAND_TIMEOUT_SECS:-120}
      PPB_DEPLOYMENT_ENV_ALLOWLIST: ${PPB_DEPLOYMENT_ENV_ALLOWLIST:-}
    volumes:
      - ./ppb.toml:/etc/ppb/ppb.toml:ro
      # The host source must already be a Unix socket before compose starts.
      - ${PMP_OPENUDS_SOCKET:?set PMP_OPENUDS_SOCKET to the host socket file}:/var/run/pmp-openuds.sock
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  ppf:
    build:
      context: ../../../ppf/Phira-plus-frontend-main
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: https://${API_DOMAIN}
        NUXT_PUBLIC_AUTH_BASE: https://${API_DOMAIN}
        NUXT_PUBLIC_SITE_URL: https://${PPF_DOMAIN}
    restart: unless-stopped
    expose:
      - "80"

  panel:
    build:
      context: ../../../panel/Phira-plus-panel-main
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: https://${API_DOMAIN}
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      ppb:
        condition: service_healthy
      ppf:
        condition: service_started
      panel:
        condition: service_started
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      PPF_DOMAIN: ${PPF_DOMAIN:?set PPF_DOMAIN}
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./caddy/compose.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
