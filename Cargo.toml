[workspace]
resolver = "2"
members = ["crates/ppb-server"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "catch-panic"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
toml = "0.8"
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-log = "0.2"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde_yaml = "0.9"
rand = "0.8"
bcrypt = "0.15"
aes-gcm = "0.10"
base64 = "0.22"
cookie = "0.18"
url = "2"
dashmap = "6"
subtle = "2"
sha2 = "0.10"
percent-encoding = "2"
p256 = { version = "0.13", features = ["arithmetic", "ecdh", "pkcs8"] }
hkdf = "0.12"
hmac = "0.12"
bincode = "1.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
utoipa = { version = "4", features = ["axum_extras", "uuid", "chrono", "serde_json"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.release.package."*"]
opt-level = 3
