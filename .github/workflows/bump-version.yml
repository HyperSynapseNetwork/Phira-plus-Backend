name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 升级类型 | major=A+1 | minor=B+1（默认）
        type: choice
        options:
          - minor  # → A.B+1.C
          - major  # → A+1.0.C
        default: "minor"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute new version
        id: version
        run: |
          FULL_VERSION=$(grep '^version = ' crates/ppb-server/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          MAJOR=$(echo "$FULL_VERSION" | cut -d. -f1)
          MINOR=$(echo "$FULL_VERSION" | cut -d. -f2)

          if [[ "${{ github.event.inputs.bump }}" == "major" ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
          else
            MINOR=$((MINOR + 1))
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            PATCH=$(git rev-list --count "$LAST_TAG"..HEAD)
          else
            PATCH=$(git rev-list --count HEAD)
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version and lockfile
        run: |
          python scripts/sync-workspace-version.py "${{ steps.version.outputs.version }}"
          cargo generate-lockfile || true

      - name: Commit and tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add crates/ppb-server/Cargo.toml Cargo.lock
          git commit -m "chore: bump version to $TAG"
          git tag -a "$TAG" -m "Version $TAG"
          git push --follow-tags
