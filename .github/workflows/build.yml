name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-patch:
    runs-on: ubuntu-latest
    outputs:
      build_ref: ${{ steps.patch.outputs.build_ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Auto patch + sync lockfile
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION=$(grep '^version = ' crates/ppb-server/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          MAJOR=$(echo "$FULL_VERSION" | cut -d. -f1)
          MINOR=$(echo "$FULL_VERSION" | cut -d. -f2)
          CURRENT_C=$(echo "$FULL_VERSION" | cut -d. -f3)
          PATCH=$((CURRENT_C + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "current=$CURRENT_C computed=$PATCH"
          cargo generate-lockfile
          if [[ "$CURRENT_C" != "$PATCH" && "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            python scripts/sync-workspace-version.py "$NEW_VERSION"
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add crates/ppb-server/Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync version + lockfile [skip ci]"
            git pull --rebase origin main
            git push
          fi
          echo "build_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: auto-patch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-patch.outputs.build_ref }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Workspace version consistency
        run: python scripts/sync-workspace-version.py --check
      - name: Static contract, provider-surface and config-security gates
        run: |
          python3 scripts/check-error-contract.py
          python3 scripts/check-auth-gateway-contract.py
          python3 scripts/check-auth-rate-limit.py
          python3 scripts/check-rest-extractors.py --self-test
          python3 scripts/check-rest-extractors.py
          python3 scripts/check-route-surface.py --self-test
          python3 scripts/check-route-surface.py
          python3 scripts/check-realtime-contract.py --self-test
          python3 scripts/check-realtime-contract.py
          python3 scripts/check-config-security.py --self-test
          python3 scripts/check-config-security.py
          python3 scripts/verify-contract-bundle.py
      - name: Current documentation truthfulness
        run: python3 scripts/check-current-docs.py

      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Tests
        run: cargo test --locked --workspace --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  build:
    needs: [auto-patch, check]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: ppb-server-linux-x86_64-musl
            env:
              CC_x86_64_unknown_linux_musl: musl-gcc
              CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: ppb-server-linux-aarch64-musl
            env:
              CC_aarch64_unknown_linux_musl: musl-gcc
              CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
              # aarch64 GCC 默认用 outline atomics（LSE），链接引用 getauxval，
              # 而 musl 无此符号 → 禁用它（与 PMP release 一致）。
              CFLAGS: -mno-outline-atomics
    runs-on: ${{ matrix.os }}
    env: ${{ matrix.env }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-patch.outputs.build_ref }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
          cache-on-failure: true
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (linux-musl ${{ matrix.target }})
        run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/ppb-server
          if-no-files-found: error

  contract-types:
    # Contract §21: the exact source commit must already contain matching
    # generated artifacts. Generation is a verifier here, never an auto-fix
    # that silently changes main after this commit was tested.
    needs: [auto-patch, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-patch.outputs.build_ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify committed Error Contract before generation
        run: python3 scripts/check-error-contract.py
      - name: Verify Auth Gateway product contract
        run: python3 scripts/check-auth-gateway-contract.py
          python3 scripts/check-auth-rate-limit.py
      - name: Verify provider runtime/config boundaries
        run: |
          python3 scripts/check-rest-extractors.py --self-test
          python3 scripts/check-rest-extractors.py
          python3 scripts/check-route-surface.py --self-test
          python3 scripts/check-route-surface.py
          python3 scripts/check-realtime-contract.py --self-test
          python3 scripts/check-realtime-contract.py
          python3 scripts/check-config-security.py --self-test
          python3 scripts/check-config-security.py
      - name: Generate OpenAPI JSON + TS types
        run: |
          bash scripts/gen-types.sh
          git diff --stat contracts/types.ts contracts/openapi.json contracts/error-codes.json contracts/contract-version.json || true
      - name: Verify generated Contract bundle
        run: |
          python3 scripts/check-error-contract.py
          python3 scripts/check-route-surface.py
          python3 scripts/check-realtime-contract.py
          python3 scripts/check-config-security.py
          python3 scripts/verify-contract-bundle.py
          # `contract-version.json.source_commit` is a moving per-commit marker
          # (GITHUB_SHA of the auto-patched build_ref) and can never match a
          # human-committed value — content is verified by verify-contract-bundle.py.
          if ! git diff --quiet -- contracts/types.ts contracts/openapi.json contracts/error-codes.json; then
            echo "Committed contract artifacts are stale for this exact source commit." >&2
            git diff -- contracts/types.ts contracts/openapi.json contracts/error-codes.json contracts/contract-version.json
            exit 1
          fi
      - name: Type-check generated TS
        run: npx --yes -p typescript tsc --noEmit --skipLibCheck contracts/types.ts
      - name: Clone frontends for consistency check
        run: |
          git clone --depth 1 https://github.com/HyperSynapseNetwork/Phira-plus-frontend.git /tmp/ppf
          git clone --depth 1 https://github.com/HyperSynapseNetwork/Phira-plus-panel.git /tmp/panel
      - name: Contract consistency check (PPF)
        run: bash scripts/check-contract-consistency.sh contracts/openapi.json /tmp/ppf/src
      - name: Contract consistency check (Panel)
        run: bash scripts/check-contract-consistency.sh contracts/openapi.json /tmp/panel
      - name: Action ID consistency check (PPF)
        run: bash scripts/check-action-ids.sh crates/ppb-server/src/actions/registry.rs /tmp/ppf/src
      - name: Action ID consistency check (Panel)
        run: bash scripts/check-action-ids.sh crates/ppb-server/src/actions/registry.rs /tmp/panel

  provenance:
    needs: [auto-patch, build, contract-types]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-patch.outputs.build_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ppb-server-*
          path: artifacts
      - name: Write exact build provenance
        env:
          SOURCE_EVENT_SHA: ${{ github.sha }}
          BUILD_REF: ${{ needs.auto-patch.outputs.build_ref }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          artifacts={str(p.relative_to('artifacts')):sha(p) for p in sorted(Path('artifacts').rglob('*')) if p.is_file()}
          data={
            'source_event_sha': os.environ['SOURCE_EVENT_SHA'],
            'build_ref': os.environ['BUILD_REF'],
            'contract_version_sha256': sha(Path('contracts/contract-version.json')),
            'openapi_sha256': sha(Path('contracts/openapi.json')),
            'artifacts': artifacts,
          }
          Path('ppb-build-provenance.json').write_text(json.dumps(data, indent=2)+'\n')
          print(json.dumps(data, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ppb-build-provenance
          path: ppb-build-provenance.json
          if-no-files-found: error
