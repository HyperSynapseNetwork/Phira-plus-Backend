name: Release

on:
  workflow_dispatch:
    inputs:
      description:
        description: 版本说明（可选）
        type: string
        default: ""
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION=$(grep '^version = ' crates/ppb-server/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          python scripts/sync-workspace-version.py --check "$FULL_VERSION"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "v$FULL_VERSION" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match Cargo version v$FULL_VERSION" >&2
            exit 1
          fi
          echo "tag=v$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

  quality-gate:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-quality
          cache-on-failure: true
      - name: Workspace version consistency
        run: python scripts/sync-workspace-version.py --check
      - name: Exact tag contract, provider-surface and config-security gates
        run: |
          python3 scripts/check-error-contract.py
          python3 scripts/check-auth-gateway-contract.py
          python3 scripts/check-auth-rate-limit.py
          python3 scripts/check-rest-extractors.py --self-test
          python3 scripts/check-rest-extractors.py
          python3 scripts/check-route-surface.py --self-test
          python3 scripts/check-route-surface.py
          python3 scripts/check-realtime-contract.py --self-test
          python3 scripts/check-realtime-contract.py
          python3 scripts/check-config-security.py --self-test
          python3 scripts/check-config-security.py
          python3 scripts/verify-contract-bundle.py
      - name: Current documentation truthfulness
        run: python3 scripts/check-current-docs.py

      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Tests
        run: cargo test --locked --workspace --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Regenerate exact contract and reject stale committed artifacts
        run: |
          bash scripts/gen-types.sh
          python3 scripts/check-route-surface.py
          python3 scripts/check-realtime-contract.py
          python3 scripts/check-config-security.py
          python3 scripts/verify-contract-bundle.py
          git diff --exit-code -- contracts/openapi.json contracts/types.ts contracts/error-codes.json contracts/contract-version.json

  build:
    needs: [version, quality-gate]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            server-name: ppb-server-linux-x86_64-musl
            ppctl-name: ppctl-linux-x86_64-musl
            env:
              CC_x86_64_unknown_linux_musl: musl-gcc
              CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            server-name: ppb-server-linux-aarch64-musl
            ppctl-name: ppctl-linux-aarch64-musl
            env:
              CC_aarch64_unknown_linux_musl: musl-gcc
              CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
              # aarch64 GCC 默认用 outline atomics（LSE），链接引用 getauxval，
              # 而 musl 无此符号 → 禁用它（与 PMP release 一致）。
              CFLAGS: -mno-outline-atomics
    runs-on: ${{ matrix.os }}
    env: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/ppb-server ${{ matrix.server-name }}
      - run: cp target/${{ matrix.target }}/release/ppctl ${{ matrix.ppctl-name }}
      - name: Smoke test (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          chmod +x ${{ matrix.server-name }} ${{ matrix.ppctl-name }}
          ./${{ matrix.server-name }} --version
          ./${{ matrix.ppctl-name }} config check || true
      - name: Verify linux-musl is statically linked
        run: |
          for f in ${{ matrix.server-name }} ${{ matrix.ppctl-name }}; do
            if file "$f" | grep -qi static; then
              echo "$f: musl build confirmed static"
            else
              echo "::error::$f: musl build is not statically linked"
              file "$f"
              exit 1
            fi
          done
      - name: Generate provenance (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            ${{ matrix.server-name }}
            ${{ matrix.ppctl-name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ppb-server-${{ matrix.target }}
          path: |
            ${{ matrix.server-name }}
            ${{ matrix.ppctl-name }}
          if-no-files-found: error

  release:
    needs: [version, quality-gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ppb-server-*
          merge-multiple: true
      - name: Generate checksum (SHA-256)
        run: |
          sha256sum ppb-server-linux-*-musl ppctl-linux-*-musl > SHA256SUMS
      - name: Generate SBOM (CycloneDX, best-effort)
        run: |
          cargo install cargo-cyclonedx --locked || echo "cargo-cyclonedx install failed"
          cargo cyclonedx --output-format json 2>/dev/null || echo "SBOM generation skipped"
          ls -la *.cdx.json 2>/dev/null && echo "SBOM generated" || echo "No SBOM file"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.version.outputs.tag }}
          name: v${{ needs.version.outputs.version }}
          body: ${{ github.event.inputs.description }}
          files: |
            ppb-server-linux-x86_64-musl
            ppctl-linux-x86_64-musl
            ppb-server-linux-aarch64-musl
            ppctl-linux-aarch64-musl
            SHA256SUMS
          prerelease: false
