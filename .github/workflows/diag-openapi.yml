name: diag-openapi
on:
  workflow_dispatch:
  push:
    branches: [diag]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Dump OpenAPI
        run: cargo run --quiet --bin ppb-server -- --openapi > /tmp/ppb-openapi.json && test -s /tmp/ppb-openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: ppb-openapi-dump
          path: /tmp/ppb-openapi.json
          if-no-files-found: error
